# Build release binaries when you push a tag like v1.0.1
# Uploads assets to GitHub Releases for that tag.
#
# JS actions run on Node 24: FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 + current action majors
# (see https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/)

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: jenkins_brute-linux-x86_64
          - os: windows-latest
            asset: jenkins_brute-windows-x86_64.exe
          - os: macos-latest
            asset: jenkins_brute-macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/jenkins_brute.exe "dist/${{ matrix.asset }}"
          else
            cp target/release/jenkins_brute "dist/${{ matrix.asset }}"
            chmod +x "dist/${{ matrix.asset }}"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2.6.1
        with:
          files: assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
